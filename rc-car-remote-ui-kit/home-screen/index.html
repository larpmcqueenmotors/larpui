<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>LARP UI — Home screen</title>
        <link rel="stylesheet" href="home.css">
        <style>
                html,
                body {
                        margin: 0;
                        height: 100%;
                        background: #000;
                        overflow: hidden;
                        color-scheme: dark;
                }

                #fit {
                        width: 100vw;
                        height: 100vh;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                }

                #screen {
                        width: 1280px;
                        height: 624px;
                        flex: 0 0 auto;
                        zoom: calc(100vw / 1280px);
                }
        </style>
</head>

<body>
        <div id="fit">
                <div id="screen" data-moving="true" data-drive="d">
                        <section class="view view-main is-on" data-app="main">
                                <aside class="rail">
                                        <div class="card speed-card">
                                                <svg class="gauge" viewBox="0 0 400 360" aria-hidden="true">
                                                        <path id="gauge-track" fill="none"
                                                                stroke="rgba(243,240,232,0.12)" stroke-width="3"></path>
                                                        <path id="gauge-value" fill="none" stroke="#f50000"
                                                                stroke-width="3" stroke-linecap="round"></path>
                                                </svg>
                                                <div class="speed-read">
                                                        <div id="speed" class="speed-num">64</div>
                                                        <div class="speed-unit">mph</div>
                                                </div>
                                        </div>
                                        <div class="card stats">
                                                <div class="stat"><span>Trip</span><b>1.84</b></div>
                                                <div class="stat"><span>Avg</span><b>42</b></div>
                                                <div class="stat"><span>Time</span><b>09</b></div>
                                                <div class="range-row">
                                                        <div class="meter meter-lg" aria-hidden="true"><span></span>
                                                        </div>
                                                        <span>312 mi</span>
                                                </div>
                                        </div>
                                </aside>
                        </section>
                </div>
        </div>
        <script src="home.js"></script>
</body>

</html>
