<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>LARP UI — Dock</title>
        <link rel="stylesheet" href="dock.css">
        <style>
                html,
                body {
                        margin: 0;
                        height: 100%;
                        background: #000;
                        overflow: hidden;
                        color-scheme: dark;
                }

                #fit {
                        width: 100vw;
                        height: 100vh;
                        display: flex;
                        align-items: flex-end;
                        justify-content: center;
                }

                #screen {
                        width: 1280px;
                        height: 112px;
                        flex: 0 0 auto;
                        zoom: calc(100vw / 1280px);
                }
        </style>
</head>

<body>
        <div id="fit">
                <div id="screen">
                        <footer class="dock">
                                <div class="zone zone-side">
                                        <button type="button" id="btn-apps" class="big-btn" data-action="sheet"
                                                data-sheet="apps" aria-label="apps" aria-pressed="false">
                                                <svg viewBox="0 0 32 32" aria-hidden="true">
                                                        <rect x="4" y="4" width="10" height="10" rx="2"
                                                                fill="currentColor" />
                                                        <rect x="18" y="4" width="10" height="10" rx="2"
                                                                fill="currentColor" />
                                                        <rect x="4" y="18" width="10" height="10" rx="2"
                                                                fill="currentColor" />
                                                        <rect x="18" y="18" width="10" height="10" rx="2"
                                                                fill="currentColor" />
                                                </svg>
                                        </button>
                                        <button type="button" id="btn-controls" class="big-btn" data-action="sheet"
                                                data-sheet="controls" aria-label="controls" aria-pressed="false">
                                                <svg viewBox="0 0 32 32" aria-hidden="true">
                                                        <path d="M6 9h20M6 16h20M6 23h20" stroke="currentColor"
                                                                stroke-width="2" stroke-linecap="round" />
                                                        <circle cx="12" cy="9" r="3" fill="currentColor" />
                                                        <circle cx="21" cy="16" r="3" fill="currentColor" />
                                                        <circle cx="15" cy="23" r="3" fill="currentColor" />
                                                </svg>
                                        </button>
                                </div>
                        </footer>
                </div>
        </div>
        <script src="dock.js"></script>
</body>

</html>
