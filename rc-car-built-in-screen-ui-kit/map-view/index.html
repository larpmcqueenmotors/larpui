<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>LARP UI — Map view</title>
        <link rel="stylesheet" href="map.css">
        <style>
                html,
                body {
                        margin: 0;
                        height: 100%;
                        background: #000;
                        overflow: hidden;
                        color-scheme: dark;
                }

                #fit {
                        width: 100vw;
                        height: 100vh;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                }

                #screen {
                        width: 1920px;
                        height: 812px;
                        flex: 0 0 auto;
                        zoom: calc(100vw / 1920px);
                }
        </style>
</head>

<body>
        <div id="fit">
                <div id="screen">
                        <section class="view view-map is-on" data-app="map">
                                <svg class="map" viewBox="0 0 1600 780" preserveAspectRatio="xMidYMid meet"
                                        aria-hidden="true">
                                        <path
                                                d="M100 600 C240 620 280 220 520 200 S780 460 980 380 S1180 140 1380 240 S1520 400 1540 320"
                                                fill="none" stroke="rgba(243,240,232,0.08)" stroke-width="18"
                                                stroke-linecap="round" />
                                        <path id="route"
                                                d="M100 600 C240 620 280 220 520 200 S780 460 980 380 S1180 140 1380 240 S1520 400 1540 320"
                                                fill="none" stroke="rgba(243,240,232,0.55)" stroke-width="3"
                                                stroke-linecap="round" />
                                        <circle cx="140" cy="560" r="5" fill="rgba(243,240,232,0.55)" />
                                        <circle cx="520" cy="200" r="5" fill="rgba(243,240,232,0.55)" />
                                        <circle cx="980" cy="380" r="5" fill="rgba(243,240,232,0.55)" />
                                        <circle cx="1320" cy="200" r="5" fill="rgba(243,240,232,0.55)" />
                                        <circle cx="1500" cy="340" r="5" fill="rgba(243,240,232,0.55)" />
                                        <g class="places">
                                                <text x="140" y="530">Depot</text>
                                                <text x="520" y="168">Ridge</text>
                                                <text x="980" y="430">Cove</text>
                                                <text x="1320" y="168">Peak</text>
                                                <text x="1500" y="390">Bay</text>
                                        </g>
                                        <circle id="dot" cx="140" cy="560" r="11" fill="#f3f0e8" />
                                </svg>
                        </section>
                </div>
        </div>
        <script src="map.js"></script>
</body>

</html>
